[package]
name = "provider-opencode"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
autotests = false

[dependencies]
async-stream = "0.3.6"
async-trait = "0.1.89"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["clock", "serde"] }
futures = "0.3.32"
gateway-admin = { path = "../../gateway-admin" }
gateway-core = { path = "../../gateway-core" }
gateway-protocol = { path = "../../gateway-protocol" }
httpdate = "1.0.3"
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "stream", "rustls-tls-native-roots", "http2", "socks"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["arbitrary_precision", "preserve_order"] }
sha2 = "0.10.9"
thiserror = "2.0.18"
tokio = { version = "1.52.3", default-features = false, features = ["macros", "sync", "time"] }
uuid = { version = "1.23.3", features = ["v4", "v7"] }

[dev-dependencies]
# 验证 Provider 交付能被真实 API 编码器消费，不进入生产依赖图。
gateway-api = { path = "../../gateway-api" }
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6.5"

[[test]]
name = "main"
path = "tests/main.rs"

[lints]
workspace = true
